# autoapply configuration (committed; no secrets here)
filter:
  categories: ["Software", "AI/ML/Data", "Quant"]      # SimplifyJobs/speedyapply category names
  allowed_terms: ["Summer 2027", "Fall 2027", "Spring 2027", "Winter 2027"]
  title_include:                                          # at least one must match (case-insensitive)
    - 'software|\bswe\b|developer|engineer|programm'
    - 'data|machine learning|\bml\b|\bai\b|artificial intelligence|analytics'
    - '\bquant|\btrader\b|\btrading\b'                    # quant research + trading (user, 2026-09-29)
  title_exclude:                                          # any match rejects
    - '\bph\.?d\b|\bmasters?\b|master''s|\bmba\b'
    - 'hardware|mechanical|electrical|civil|chemical|manufacturing|\basic\b|\bfpga\b|\brf\b'
    - 'product manag|program manag|\bsales\b|marketing|recruit|designer|\bux\b'
  require_bachelors: true
  us_only: true
  us_citizen: true

boards:                    # verified 2026-09-29; token: display name
  greenhouse:
    wehrtyou: Hudson River Trading
    jumptrading: Jump Trading
    imc: IMC
    optiverus: Optiver
    drweng: DRW
    schonfeld: Schonfeld
    virtu: Virtu Financial
    towerresearchcapital: Tower Research Capital
    akunacapital: Akuna Capital
    point72: Point72
    clearstreet: Clear Street
    flowtraders: Flow Traders
  lever:
    belvederetrading: Belvedere Trading
  ashby: {}

llm:                       # all LLM work goes through `claude -p` on the subscription
  model: haiku
  daily_total: 400         # claude -p calls per day, all purposes
  per_purpose: {fit: 150, tailor: 60, answers: 200, cover: 60}
  purpose_models: {answers: sonnet, cover: sonnet, tailor: sonnet}   # writing that goes out under your name

resume:
  master_pdf: 'C:\Users\24GHi\Downloads\Hipszer_Resume2026.pdf'
  master_yaml: resume.yaml           # gitignored; set verified: true to allow tailoring
  out_dir: 'C:\Users\24GHi\Downloads\autoapply_resumes'
  tailor_threshold: 70               # fit score at/above this uses the master PDF unchanged

run:
  daily_cap: 100
  per_company_per_cycle: 3
  per_cycle: 8                       # submissions per 30-minute scheduled run
  spacing_seconds: [120, 360]
  discover_every_hours: 3
  ats_enabled: [greenhouse, workable, jazzhr, bamboohr, ashby, lever]   # + workday after a supervised pilot
  assist_only: [ashby, lever]   # bot-checked sites: filled + queued for `autoapply assist` (you click Submit)
